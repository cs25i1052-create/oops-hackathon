<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ClaimLoom Check</title>
    <style>
        body {
            width: 360px;
            margin: 0;
            padding: 14px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }

        .brand {
            font-weight: 700;
            font-size: 15px;
            color: #f8fafc;
        }

        .badge {
            font-size: 11px;
            background: #1e3a8a;
            color: #93c5fd;
            padding: 2px 8px;
            border-radius: 999px;
        }

        label {
            font-size: 11px;
            color: #94a3b8;
            display: block;
            margin-bottom: 4px;
        }

        select,
        textarea,
        input {
            width: 100%;
            box-sizing: border-box;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 7px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        textarea {
            height: 76px;
            resize: vertical;
        }

        button {
            width: 100%;
            background: #ff5500;
            color: #ffffff;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .score-bar {
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }

        .issue-card {
            margin-top: 8px;
            padding: 8px;
            border-radius: 6px;
            background: #1e293b;
            border-left: 3px solid #ef4444;
            font-size: 12px;
        }

        .issue-fix {
            margin-top: 5px;
            display: inline-block;
            background: #065f46;
            color: #a7f3d0;
            padding: 3px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .status-msg {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="brand">ClaimLoom Gatekeeper</span>
        <span class="badge">MV3 Extension</span>
    </div>

    <label for="apiUrl">Backend Engine URL</label>
    <input id="apiUrl" type="text" value="https://oops-hackathon.onrender.com" />

    <label for="channel">Target Channel</label>
    <select id="channel">
        <option value="general">General Copy</option>
        <option value="linkedin">LinkedIn B2B</option>
        <option value="instagram">Instagram Caption</option>
        <option value="billboard">Highway Billboard (12w max)</option>
        <option value="email">Marketing Email</option>
    </select>

    <label for="draftText">Selected / Draft Text</label>
    <textarea id="draftText"
        placeholder="Highlight text on any page before clicking the extension, or paste copy here..."></textarea>

    <button id="scanBtn">Scan with ClaimLoom</button>
    <div id="output"></div>

    <script src="popup.js"></script>
</body>

</html>
