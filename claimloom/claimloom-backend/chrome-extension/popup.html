<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClaimLoom Copy Check</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand-mark">CL</div>
        <div><h1>ClaimLoom</h1><p>Pre-publication copy check</p></div>
      </header>
      <label class="toggle-row" for="localBackend"><input id="localBackend" type="checkbox"> Use local backend (localhost:8000)</label>
      <label for="api">Backend URL</label>
      <input id="api" type="url" value="https://oops-hackathon.onrender.com" aria-label="Backend URL">
      <label for="channel">Channel</label>
      <select id="channel">
        <option value="general">General</option>
        <option value="linkedin">LinkedIn</option>
        <option value="instagram">Instagram</option>
        <option value="billboard">Billboard</option>
        <option value="email">Email</option>
      </select>
      <label for="draft">Text to scan (select text on the page or paste here)</label>
      <textarea id="draft" rows="5" placeholder="Select text on the active page, or paste copy here."></textarea>
      <button id="scan" type="button">Scan copy</button>
      <p id="status" role="status">Select copy on a page, then run a scan.</p>
      <section id="results" aria-live="polite"></section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
