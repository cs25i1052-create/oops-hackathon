name: ClaimLoom CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r claimloom/claimloom-backend/requirements.txt pytest
      - name: Run backend verification
        env:
          AI_MODE: rules_only
        run: pytest claimloom/claimloom-backend/verify_backend.py -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claimloom/claimloom-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: claimloom/claimloom-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
